<!-- 微信可粘贴片段模板：全内联样式，每段用 <section> 包裹，文末 <v2></v2>。 -->
<!-- 替换 {{...}} 占位符；不要保留此注释块（微信会过滤但不报错）。 -->

<section style="text-align:center;padding:0;">
  <h1 style="font-size:23px;font-weight:700;text-align:center;color:#1a3a5c;margin:30px 16px 10px;line-height:1.45;">{{TITLE}}</h1>
</section>

<section style="padding:0;">
  <blockquote style="margin:1.5em 0;padding:15px 20px;background:#f5f7fa;border-left:4px solid #1a3a5c;border-radius:0 8px 8px 0;"><p style="font-size:15px;line-height:1.7;color:#666666;margin:0;"><strong style="color:#1a3a5c;font-weight:700;">摘要</strong>：{{SUMMARY}}</p></blockquote>
</section>

<section style="padding:0;">
  <p style="font-size:16px;line-height:1.8;color:#333333;margin:0 0 1.5em;letter-spacing:1px;">{{LEAD_PARAGRAPH}}</p>
</section>

<section style="padding:0;">
  <h2 style="font-size:18px;font-weight:700;color:#1a1a1a;margin:2.5em 0 1em;padding-left:10px;border-left:4px solid #1a3a5c;line-height:1.5;">{{SECTION_HEADING}}</h2>
</section>

<section style="padding:0;">
  <p style="font-size:16px;line-height:1.8;color:#333333;margin:0 0 1.5em;letter-spacing:1px;"><strong style="color:#1a3a5c;font-weight:700;">{{KEY_JUDGMENT}}</strong>{{BODY_PARAGRAPH}}</p>
</section>

<section style="padding:0;">
  <blockquote style="margin:1.5em 0;padding:15px 20px;background:#f5f7fa;border-left:4px solid #1a3a5c;border-radius:0 8px 8px 0;"><p style="font-size:15px;line-height:1.7;color:#666666;margin:0;">{{QUOTE}}</p></blockquote>
</section>

<section style="height:1px;background:#eee;margin:12px 16px;"></section>

<section style="padding:6px 16px;">
  <p style="font-size:14px;line-height:1.6;color:#999;margin:0;">{{AUTHOR}} · {{DATE}}</p>
</section>

<v2></v2>
